[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
uuid.workspace = true
async-trait.workspace = true
thiserror.workspace = true
chrono.workspace = true
dotenvy.workspace = true

ratatui = { version = "0.30", default-features = false, features = ["termion", "macros", "all-widgets", "layout-cache"] }
termion = "4"
reqwest = { version = "0.12", features = ["json"] }
dirs = "5.0"
