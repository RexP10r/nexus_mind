[package]
name = "lm-worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lm-worker"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
uuid.workspace = true
async-trait.workspace = true
thiserror.workspace = true
chrono.workspace = true
dotenvy.workspace = true

axum = "0.8"
tonic = "0.13"
prost = "0.13"
anyhow = "1"
comrak = "0.31"
meval = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-log = "0.2"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
schemars = "1.2.1"
redis = { version = "0.28", features = ["tokio-comp"] }
bson = { version = "2", features = ["chrono-0_4"] }
mongodb = "3.3"
futures-util = "0.3"
qdrant-client = "1"
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "download-binaries"] }
tokenizers = "0.21"
rust-stemmers = "1"
unicode-segmentation = "1"
parking_lot = "0.12"

[build-dependencies]
tonic-build = "0.13"
